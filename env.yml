name: metabolic_env
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core scripts (METABOLIC-C.pl, METABOLIC-G.pl, METABOLIC-C.2nd_run.pl)
  - perl=5.22.0.1
  - perl-bioperl=1.6.924        # used by Accessory_scripts/gff2fasta_mdf.pl
  - perl-parallel-forkmanager=1.17
  - perl-statistics-descriptive=3.0612

  # Accessory_scripts/hmmscan-parser-dbCANmeta.py (standard library only)
  - python>=3

  # Figure and spreadsheet generation (the five *.R scripts)
  - r-base=4.5.3
  - r-diagram=1.6.5
  - r-dplyr=1.2.1
  - r-forcats=1.0.1
  - r-ggalluvial=0.12.6
  - r-ggraph=2.2.2
  - r-ggthemes=6.0.0
  - r-igraph=2.3.3
  - r-openxlsx=4.2.8.1
  - r-plyr=1.8.9
  - r-stringr=1.6.0
  - r-tidygraph=1.3.0
  - r-tidyverse=2.0.0

  # Annotation and search tools
  - hmmer=3.4
  - prodigal=2.6.3
  - diamond=2.2.5

  # Read mapping / coverage (METABOLIC-C)
  - bowtie2=2.5.5
  - minimap2=2.31
  - samtools=1.24
  - sambamba=1.0.1
  - coverm=0.8.0

  # Used by -download-db and by the dbCAN2 hmmscan parser pipeline
  - curl=8.22.0
  - tar=1.35
  - gzip=1.14
  - coreutils=9.11
  - sed=4.10
  - grep=3.12
  - gawk=5.4.1
